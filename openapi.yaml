swagger: '2.0'
info:
  title: Task Pulse API Gateway
  description: API Gateway routing to microservices
  version: 1.0.0
schemes:
  - https
produces:
  - application/json
paths:
  /api/auth/{path}:
    get:
      summary: Proxy GET requests to Auth Service
      operationId: proxyAuthGet
      parameters:
        - name: path
          in: path
          required: true
          type: string
          description: Sub-path for auth service
      x-google-backend:
        address: https://task-pulse-u8t2.onrender.com/api/auth/{path}
        deadline: 30.0
      responses:
        '200':
          description: A successful response
    post:
      summary: Proxy POST requests to Auth Service
      operationId: proxyAuthPost
      parameters:
        - name: path
          in: path
          required: true
          type: string
          description: Sub-path for auth service
      x-google-backend:
        address: https://task-pulse-u8t2.onrender.com/api/auth/{path}
        deadline: 30.0
      responses:
        '200':
          description: A successful response